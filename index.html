<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
        }
    </style>
    <script type="application/javascript" src="battleship.js"></script>
</head>
<body>
    <script>
        setTimeout(() => {
            const div = document.createElement('div');
            div.style.position = 'absolute';
            div.style.top = '15px';
            div.style.left = '15px';
            div.style.zIndex = '9999';
            div.innerHTML = '<a href="./showcase/" style="padding: 10px 15px; background-color: #2b2b2b; color: white; text-decoration: none; font-family: sans-serif; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #444;">📖 Showcase Page</a>';
            document.body.appendChild(div);
        }, 1000);
    </script>
</body>
</html>
